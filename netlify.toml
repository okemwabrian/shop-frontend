[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://shop-backend-z2fb.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Keep report-only until browser reports confirm any additional required sources.
    # Review style-src because the app uses inline style attributes and Google Identity Services injects styles.
    # Review img-src: admins can configure product images on arbitrary HTTPS hosts; narrow this if reports and image hosting permit.
    # Review the Google and API/WebSocket sources against reports after deploying with Google sign-in enabled.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; connect-src 'self' https://shop-backend-z2fb.onrender.com wss://shop-backend-z2fb.onrender.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
